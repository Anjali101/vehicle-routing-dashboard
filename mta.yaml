_schema-version: '3.1'
ID: vrp-scenario
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx -p @sap/cds-dk cds build --production
        - rm -rf incidents-ui-deployer/resources
        - npm install --production
        - npx -p @sap/cds-dk cds build --production
        - mkdir gen/ui-resources
modules:
  - name: vrp-scenario-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: vrp-scenario-auth
      - name: vrp-scenario-db

  - name: vrp-scenario-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: vrp-scenario-db

  - name: vrp-scenario-ui-resources
    type: com.sap.application.content
    path: gen/ui-resources
    requires:
      - name: vrp-scenario-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      requires:
        - name: vrp-test
          artifacts:
            - ./*.zip
          target-path: .
        - name: classification
          artifacts:
            - ./*.zip
          target-path: .
        - name: insights
          artifacts:
            - ./*.zip
          target-path: .
        - name: characteristics
          artifacts:
            - ./*.zip
          target-path: .
        

  - name: vrp-test
    type: html5
    path: app/vrp-test
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npx -p @ui5/cli ui5 build --dest ../../gen/app/vrp-test/dist --include-task=generateManifestBundle --include-task=generateCachebusterInfo
        - bash -c "cd ../../gen/app/vrp-test/dist && npx bestzip ../vrp-test.zip *"
      supported-platforms: []
      build-result: ../../gen/app/vrp-test

  - name: classification
    type: html5
    path: app/classification
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npx -p @ui5/cli ui5 build --dest ../../gen/app/classification/dist --include-task=generateManifestBundle --include-task=generateCachebusterInfo
        - bash -c "cd ../../gen/app/classification/dist && npx bestzip ../classification.zip *"
      supported-platforms: []
      build-result: ../../gen/app/classification

  - name: insights
    type: html5
    path: app/insights
    build-parameters:
      builder: custom
      commands:
         - npm install
         - npx -p @ui5/cli ui5 build --dest ../../gen/app/insights/dist --include-task=generateManifestBundle --include-task=generateCachebusterInfo
         - bash -c "cd ../../gen/app/insights/dist && npx bestzip ../insights.zip *"
      supported-platforms: []
      build-result: ../../gen/app/insights

  
  - name: characteristics
    type: html5
    path: app/characteristics
    build-parameters:
      builder: custom
      commands:
         - npm install
         - npx -p @ui5/cli ui5 build --dest ../../gen/app/characteristics/dist --include-task=generateManifestBundle --include-task=generateCachebusterInfo
         - bash -c "cd ../../gen/app/characteristics/dist && npx bestzip ../characteristics.zip *"
      supported-platforms: []
      build-result: ../../gen/app/characteristics
  




  - name: vrp-scenario-portal-content-deployer
    type: com.sap.application.content
    path: packages/deploy-int/portal-content
    requires:
      - name: vrp-scenario-portal
        parameters:
          content-target: true
          service-key:
            name: incidents-portal-deploy-key
            config:
              content-endpoint: developer
      - name: vrp-scenario-auth
      - name: vrp-scenario-html5-repo-host
      - name: vrp-scenario-ui-resources

  - name: vrp-scenario-approuter
    type: nodejs
    path: packages/deploy-int/approuter
    parameters:
      memory: 128M
    requires:
      - name: vrp-scenario-auth
      - name: vrp-scenario-portal
      - name: vrp-scenario-html5-repo-runtime
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          strictSSL: true
          name: srv-api
          url: '~{srv-url}'

resources:
  - name: vrp-scenario-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: vrp-scenario-${org}-${space}
        tenant-mode: dedicated
  - name: vrp-scenario-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      
  - name: vrp-scenario-portal
    type: org.cloudfoundry.managed-service
    parameters:
      service-plan: standard
      service: portal

  - name: vrp-scenario-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service-plan: app-runtime
      service: html5-apps-repo

  - name: vrp-scenario-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service-plan: app-host
      service: html5-apps-repo
      service-name: vehicle-routing-dashboard-html5-repo-host