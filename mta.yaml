_schema-version: 3.3.0
ID: vrp-scenario
description: A simple CAP project.
version: 1.0.0
modules:
- name: vrp-scenario-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: vrp-scenario-db
  - name: vrp-scenario-auth
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
    memory: 256M
  build-parameters:
    builder: npm-ci
- name: vrp-scenario-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: vrp-scenario-db
  parameters:
    buildpack: nodejs_buildpack
- name: vehicle-routing-dashboard-ui-resources
  type: com.sap.application.content
  path: gen/ui-resources
  requires:
  - name: vehicle-routing-dashboard-html5-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - classification.zip
      name: classification
      target-path: .
    - artifacts:
      - vrp-test.zip
      name: vrp-test
      target-path: .
    - artifacts:
      - characteristics.zip
      name: characteristics
      target-path: resources/
    - artifacts:
      - insights.zip
      name: insights
      target-path: resources/
- name: classification
  type: html5
  path: app/classification
  build-parameters:
    build-result: ../../gen/app/classification
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: vrp-test
  type: html5
  path: app/vrp-test
  build-parameters:
    build-result: ../../gen/app/vrp-test
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: vehicle-routing-dashboard-portal-content-deployer
  type: com.sap.application.content
  path: packages/deploy-int/portal-content
  requires:
  - name: vehicle-routing-dashboard-portal
    parameters:
      content-target: true
      service-key:
        config:
          content-endpoint: developer
        name: incident-management-portal-deploy-key
  - name: vehicle-routing-dashboard-auth
  - name: vehicle-routing-dashboard-html5-repo-host
  - name: vehicle-routing-dashboard-ui-resources
- name: vehicle-routing-dashboard-approuter
  type: nodejs
  path: packages/deploy-int/approuter
  requires:
  - name: vehicle-routing-dashboard-auth
  - name: vehicle-routing-dashboard-portal
  - name: vehicle-routing-dashboard-html5-repo-runtime
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      strictSSL: true
      url: ~{srv-url}
  parameters:
    memory: 128M
- name: characteristics
  type: html5
  path: app/characteristics
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: insights
  type: html5
  path: app/insights
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: vrp-scenario-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: vrp-scenario-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: vrp-scenario-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: vehicle-routing-dashboard-portal
  type: org.cloudfoundry.managed-service
  parameters:
    service: portal
    service-plan: standard
- name: vehicle-routing-dashboard-html5-repo-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
- name: vehicle-routing-dashboard-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: vehicle-routing-dashboard-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: incidents-mgmt-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: vrp-scenario-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: vrp-scenario-destination-service
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
    - rm -rf vehicle-routing-dashboard-ui-deployer/resources
    - npm install --production
    - npx -p @sap/cds-dk cds build --production
    - mkdir gen/ui-resources
