<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <script>
            window['sap-ushell-config'] = {
                defaultRenderer: 'fiori2',
                applications: {
                    "vrp-test": {
                        title: 'VRP Visualization',
                        description: 'Visualization',
                        additionalInformation: 'SAPUI5.Component=vrp-test',
                        applicationType: 'URL',
                        url: "./vrp-test/webapp",
                        navigationMode: 'embedded',
          },  
          
          "classification-display": {
                        title: 'VRP Classification',
                        description: 'Classification',
                        additionalInformation: 'SAPUI5.Component=classification',
                        applicationType: 'URL',
                        url: "./classification/webapp",
                        navigationMode: 'embedded',
          },
        },
                    };
            
        </script>
        <script src="https://ui5.sap.com/test-resources/sap/ushell/bootstrap/sandbox.js"></script>
        <script
            src="https://ui5.sap.com/resources/sap-ui-core.js"
            data-sap-ui-libs="sap.m, sap.ushell, sap.fe.templates"
            data-sap-ui-compatVersion="edge"
            data-sap-ui-theme="sap_horizon"
            data-sap-ui-frameOptions="allow"
            data-sap-ui-bindingSyntax="complex"
            data-sap-ui-resourceroots='{
                "vrp-test": "./vrp-test/webapp",
                "classification": "./classification/webapp"
              }'
        ></script>
        <script>
            sap.ui.getCore().attachInit(function() {
                sap.ushell.Container.createRenderer().placeAt('content');
            });
        </script>
    </head>
    <body class="sapUiBody" id="content"></body>
</html>
